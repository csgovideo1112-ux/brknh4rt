<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BRKNH4RT</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/img.ico" type="image/x-icon">
</head>
<body>

  <h1 class="title">BRKNH4RT</h1>

  <div class="tabs">
    <a href="index.html" data-i18n="nav_main">Main</a>
    <a href="music.html" data-i18n="nav_music">Music</a>
    <a href="lyrics.html" class="active" data-i18n="nav_lyrics">Lyrics</a>
  </div>

  <div class="lyrics-list" id="lyrics-container">
    <!-- rendered by JS -->
  </div>

  <script src="i18n.js"></script>
  <script>
    initLang();
    renderLyrics();

    document.addEventListener('langChanged', renderLyrics);

    function renderLyrics() {
      const lang     = getCurrentLang();
      const songs    = i18n[lang]['lyrics'];
      const container = document.getElementById('lyrics-container');
      container.innerHTML = songs.map(song => `
        <div class="song">
          <h2>${song.title}</h2>
          <p>${song.lines.join('<br>')}</p>
        </div>
      `).join('<hr class="divider">');
    }
  </script>
</body>
</html>
