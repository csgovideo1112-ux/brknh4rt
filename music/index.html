<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BRKNH4RT</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/img/img.ico" type="image/x-icon">
</head>
<body>
<div class="win">
  <div class="titlebar">
    <img src="/img/img.ico" alt="">
    <span class="name">music.html</span>
    <div class="winbtns">
      <button class="tb" data-lang="ru" onclick="setLang('ru')">RU</button>
      <button class="tb" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="tb" data-lang="de" onclick="setLang('de')">DE</button>
    </div>
  </div>

  <div class="toolbar">
    <a class="tb" href="/" data-i18n="nav_main">Главная</a>
    <a class="tb on" href="/music" data-i18n="nav_music">Музыка</a>
    <a class="tb" href="/lyrics" data-i18n="nav_lyrics">Тексты</a>
  </div>

  <div class="row">
    <label for="sel" data-i18n="albums_label">Альбомы:</label>
    <select class="field" id="sel">
      <option value="" data-i18n="pick_album"></option>
      <option value="1">DELUXE UND SCHÖNHEIT</option>
      <option value="2">ANHEDONIA</option>
      <option value="3">SUFFOCATE</option>
    </select>
  </div>

  <div class="view">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint" data-i18n="pick_album"></div>
  </div>

  <div class="caption" id="caption"></div>

  <div class="status">
    <span class="s1" id="st1"></span>
    <span class="s2" id="st2"></span>
    <span class="s3">Internet</span>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/retro.js"></script>
<script>
  initLang();

  const LINKS = {
    '1': 'http://band.link/deluxeundschonheit',
    '2': 'https://band.link/anh4rt',
    '3': null
  };

  const sel     = document.getElementById('sel');
  const cv      = document.getElementById('cv');
  const hint    = document.getElementById('hint');
  const caption = document.getElementById('caption');
  const st1     = document.getElementById('st1');
  const st2     = document.getElementById('st2');
  let current = '';

  function t() { return i18n[getCurrentLang()]; }

  function renderCaption() {
    if (!current) { caption.innerHTML = ''; return; }
    const link = LINKS[current];
    caption.innerHTML = '<p></p>' + (link
      ? '<a class="btn" target="_blank" rel="noopener"></a>'
      : '<span class="btn off"></span>');
    caption.querySelector('p').textContent = t().albums[current].desc;
    const b = caption.querySelector('.btn');
    b.textContent = link ? t().listen : t().soon;
    if (link) b.href = link;
  }

  sel.addEventListener('change', async function () {
    current = sel.value;
    caption.innerHTML = '';
    if (!current) {
      clearCanvas(cv); hint.classList.remove('hide');
      st1.textContent = ''; st2.textContent = '';
      return;
    }
    hint.classList.add('hide');
    const src = '/img/album0' + current + '.webp';
    st2.textContent = LINKS[current] ? LINKS[current].replace(/^https?:\/\//, '') : src;
    st1.textContent = t().loading;
    const img = await loadImage(src);
    if (!img || sel.value !== current) return;
    const ok = await progressiveLoad(cv, img, p => { st1.textContent = t().loading + ' ' + p + '%'; });
    if (!ok) return;
    st1.textContent = t().done;
    renderCaption();
  });

  document.addEventListener('langChanged', () => {
    if (current && caption.innerHTML) renderCaption();
    if (current && st1.textContent) st1.textContent = t().done;
  });
</script>
</body>
</html>
